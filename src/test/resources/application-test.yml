spring:
  ai:
    # Stub OpenAI/OpenRouter config — never contacted during the normal test lifecycle.
    openai:
      base-url: http://localhost:0
      api-key: test-key
      chat:
        options:
          model: test-model
    ollama:
      # A base URL that is never contacted during the normal test lifecycle.
      base-url: http://localhost:0
      init:
        pull-model-strategy: never

application:
  extraction:
    maximum-transcript-length: 15000
    maximum-model-response-length: 100000
    maximum-correction-attempts: 1
    model-timeout: 45s
    queue-wait-timeout: 10s
    maximum-concurrent-model-calls: 4
    maximum-pending-model-calls: 50
    maximum-eggs-per-observation: 20
    maximum-chicks-per-observation: 20
    evidence-check-enabled: true
    persist-raw-transcript: false
    legacy-fields-enabled: false
    strict-vocabulary-validation: false
    rag-enabled: false
    maximum-infrastructure-retries: 1
