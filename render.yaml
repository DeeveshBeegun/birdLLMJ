# Render Blueprint: deploy the Spring Boot app as a single Docker web service.
# The LLM runs on Modal's GPU (see deploy/ollama_modal.py), so no Ollama service is needed here.
#
# Deploy: push to GitHub, then in Render -> New -> Blueprint, point at this repo.
# Docs: https://render.com/docs/blueprint-spec
services:
  - type: web
    name: wildlife-form-extractor
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free                           # 512MB RAM, spins down when idle (see notes below)
    region: oregon
    healthCheckPath: /actuator/health/liveness
    autoDeploy: true
    envVars:
      - key: OLLAMA_BASE_URL
        value: https://deeveshbeegun--ollama-wildlife-serve.modal.run
      - key: OLLAMA_CHAT_MODEL
        value: llama3.2:3b
      # Fit the JVM into 512MB: cap heap%, use the low-footprint Serial GC, bound metaspace and
      # thread stacks. Trim these further if the instance OOMs on startup.
      - key: JAVA_TOOL_OPTIONS
        value: "-XX:MaxRAMPercentage=60 -XX:+UseSerialGC -XX:MaxMetaspaceSize=128m -Xss512k"
      # Fewer Tomcat threads = less memory (a single-user demo needs very few).
      - key: SERVER_TOMCAT_THREADS_MAX
        value: "15"
      - key: SERVER_TOMCAT_THREADS_MIN_SPARE
        value: "1"
